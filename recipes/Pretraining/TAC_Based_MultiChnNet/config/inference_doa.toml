[acoustics]
n_fft = 257
win_length = 512
sr = 16000
hop_length = 256

[inferencer]
path = "TAC_Based_MultiChnNet.inferencer_doa.InferencerDOA"
[inferencer.args]

[array_geometry]
n_mic = 7
# change inference_geometry to the array you want to evaluate
inference_geometry = [0, 1, 2, 3, 4, 5, 6]
# other options:
# inference_geometry = [0, 3]
# inference_geometry = [0, 2, 4]
# inference_geometry = [0, 3, 6]
# inference_geometry = [0, 1, 3, 4, 6]

[dataset]
path = "dataset_inference.Dataset"

[dataset.args]
dataset_path = "/path/to/data_simulation/librispeech/multi_chn_simu/pkl_ark_data/test_clean/ark_pickle/test_clean_ark.pkl"
max_nspk = 3
n_mic = 7

[model]
path = "TAC_Based_MultiChnNet.model_doa.ModelDOA"

[model.args]
N = 256
B = 256
H = 512
P = 3
X = 8
R = 4
V = 256
norm = "BN"
sr = 16000
AF_premasking = false
out_spk = 1
non_linear = "linear"
causal = false
FFT_SIZE = 512
HOP_SIZE = 256
NFFT = 257
input_features = ["LPS", "IPD", "AF"]
cosIPD = true
sinIPD = false
speaker_feature_dim = 1
merge_mode = "sum"
num_doa_bins = 18  # 180° / 18 = 10° per bin
doa_angle_range_deg = 180.0
max_nspk = 3
training_phase = 2
use_pred_doa_for_af = true
onset_pool_ratio = 1.0

[doa]
num_doa_bins = 18  # 180° / 18 = 10° per bin
doa_angle_range_deg = 180.0
