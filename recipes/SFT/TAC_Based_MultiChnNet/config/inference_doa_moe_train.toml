[acoustics]
n_fft = 257
win_length = 512
sr = 16000
hop_length = 256

[inferencer]
path = "TAC_Based_MultiChnNet.inferencer_doa_moe.InferencerDOAMoE"
[inferencer.args]

[array_geometry]
n_mic = 7
inference_geometry = [0, 1, 3, 4, 6]

[dataset]
path = "dataset_inference.Dataset"

[dataset.args]
dataset_path = "/path/to/data/librispeech/multi_chn_simu_large_rx1.5/pkl_ark_data/train_960/ark_pickle/train_960_ark.pkl"
max_nspk = 3
n_mic = 7

[model]
path = "TAC_Based_MultiChnNet.model_doa_moe.ModelDOAMoE"

[model.args]
N = 256
B = 256
H = 512
P = 3
X = 8
R = 4
V = 256
norm = "BN"
sr = 16000
AF_premasking = false
out_spk = 1
non_linear = "linear"
causal = false
FFT_SIZE = 512
HOP_SIZE = 256
NFFT = 257
input_features = ["LPS", "IPD", "AF"]
cosIPD = true
sinIPD = false
speaker_feature_dim = 1
merge_mode = "sum"
TCN_layers = 6
add_adapter_pos = -1
ada_num = 4
geometry_num = 1
ce_loss = false
num_doa_bins = 18
doa_angle_range_deg = 180.0
max_nspk = 3
onset_pool_ratio = 1.0
use_pred_doa_for_af = true

[doa]
num_doa_bins = 18
doa_angle_range_deg = 180.0
